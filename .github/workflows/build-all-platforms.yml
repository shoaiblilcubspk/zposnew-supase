name: Build All Platforms (DMG, EXE, APK, IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. macOS Desktop Installer (.dmg)
  # ========================================================
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS Tauri DMG (Universal: Intel x86_64 + Apple Silicon aarch64)
        run: npx tauri build --target universal-apple-darwin

      - name: Prepare macOS DMG with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          DMG_FILE=$(find src-tauri/target -name "*.dmg" -type f | head -n 1)
          echo "Found DMG file: $DMG_FILE"
          cp "$DMG_FILE" "release-output/Zaynahs-POS-v${VERSION}.dmg"
          ls -lh release-output/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-macOS-DMG
          path: release-output/*.dmg
          retention-days: 30

  # ========================================================
  # 2. Windows Desktop Installer (.exe)
  # ========================================================
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Tauri EXE
        run: npx tauri build

      - name: Prepare Windows Installers with Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          EXE_FILE=$(find src-tauri/target -name "*.exe" -type f | grep -i "setup" | head -n 1)
          MSI_FILE=$(find src-tauri/target -name "*.msi" -type f | head -n 1)
          if [ -n "$EXE_FILE" ]; then cp "$EXE_FILE" "release-output/Zaynahs-POS-v${VERSION}-Setup.exe"; fi
          if [ -n "$MSI_FILE" ]; then cp "$MSI_FILE" "release-output/Zaynahs-POS-v${VERSION}.msi"; fi
          ls -lh release-output/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Windows-EXE
          path: |
            release-output/*.exe
            release-output/*.msi
          retention-days: 30

  # ========================================================
  # 3. Android Mobile App (.apk)
  # ========================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Android APK with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          APK_FILE=$(find android/app/build -name "*.apk" -type f | head -n 1)
          echo "Found APK file: $APK_FILE"
          cp "$APK_FILE" "release-output/Zaynahs-POS-v${VERSION}.apk"
          ls -lh release-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Android-APK
          path: release-output/*.apk
          retention-days: 30

  # ========================================================
  # 4. iOS Mobile App (.ipa)
  # ========================================================
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode and iOS Platform
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi

          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode App & Archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -showdestinations || true
          # Attempt generic iOS device archive, fallback to generic iOS Simulator
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive || \
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package into IPA with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p build/Payload release-output
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r "../release-output/Zaynahs-POS-v${VERSION}.ipa" Payload
            cd ..
            ls -lh release-output/
          else
            echo "Error: App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-iOS-IPA
          path: release-output/*.ipa
          retention-days: 30

  # ========================================================
  # 5. Automated Universal GitHub Release Publishing
  # ========================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-dmg, build-windows-exe, build-android-apk, build-ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Installers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Publish GitHub Release with Direct Download Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" release-files/* \
            --title "Zaynahs POS v${VERSION} (Universal All-Platform)" \
            --notes "Universal Multi-Platform Release v${VERSION} — Compatible with Intel + Apple Silicon macOS, Android phones/tablets, iOS devices, and Windows PCs." \
            --draft=false \
            --prerelease=false || \
          gh release upload "v${VERSION}" release-files/* --clobber
