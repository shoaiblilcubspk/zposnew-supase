name: Build All Platforms (DMG, EXE, AppImage, APK, IPA)

# Manual only — native installers are built on demand (with signing credentials) via the
# "Run workflow" button. Web/PWA ships continuously via Vercel on push; this workflow does
# NOT run on push so day-to-day web updates never trigger native builds.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. macOS Desktop Installer (.dmg) — Electron
  # ========================================================
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets + Electron main
        run: |
          npm run build
          npm run electron:compile

      - name: Build macOS DMG (Electron, x64 + arm64)
        run: npx electron-builder --mac dmg --publish never

      - name: Prepare macOS DMG with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          i=0
          for f in $(find dist-electron -name "*.dmg" -type f); do
            if [ "$i" -eq 0 ]; then cp "$f" "release-output/Zaynahs-POS-v${VERSION}.dmg";
            else cp "$f" "release-output/Zaynahs-POS-v${VERSION}-$i.dmg"; fi
            i=$((i+1))
          done
          ls -lh release-output/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-macOS-DMG
          path: release-output/*.dmg
          retention-days: 30

  # ========================================================
  # 2. Windows Desktop Installer (.exe) — Electron
  # ========================================================
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets + Electron main
        shell: bash
        run: |
          npm run build
          npm run electron:compile

      - name: Build Windows installer (Electron NSIS + portable)
        run: npx electron-builder --win nsis portable --publish never

      - name: Prepare Windows Installers with Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          SETUP_FILE=$(find dist-electron -maxdepth 1 -name "*.exe" -type f | grep -i "setup" | head -n 1 || true)
          PORTABLE_FILE=$(find dist-electron -maxdepth 1 -name "*.exe" -type f | grep -iv "setup" | head -n 1 || true)
          [ -n "$SETUP_FILE" ] && cp "$SETUP_FILE" "release-output/Zaynahs-POS-v${VERSION}-Setup.exe"
          [ -n "$PORTABLE_FILE" ] && cp "$PORTABLE_FILE" "release-output/Zaynahs-POS-v${VERSION}-Portable.exe"
          ls -lh release-output/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Windows-EXE
          path: release-output/*.exe
          retention-days: 30

  # ========================================================
  # 3. Linux Desktop Installer (.AppImage + .deb) — Electron
  # ========================================================
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets + Electron main
        run: |
          npm run build
          npm run electron:compile

      - name: Build Linux installers (Electron AppImage + deb)
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Prepare Linux installers with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          APPIMAGE=$(find dist-electron -maxdepth 1 -name "*.AppImage" -type f | head -n 1 || true)
          DEB=$(find dist-electron -maxdepth 1 -name "*.deb" -type f | head -n 1 || true)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "release-output/Zaynahs-POS-v${VERSION}.AppImage"
          [ -n "$DEB" ] && cp "$DEB" "release-output/Zaynahs-POS-v${VERSION}.deb"
          ls -lh release-output/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Linux
          path: release-output/*
          retention-days: 30

  # ========================================================
  # 4. Android Mobile App (.apk) — Capacitor
  # ========================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Android APK with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-output
          APK_FILE=$(find android/app/build -name "*.apk" -type f | head -n 1)
          echo "Found APK file: $APK_FILE"
          cp "$APK_FILE" "release-output/Zaynahs-POS-v${VERSION}.apk"
          ls -lh release-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Android-APK
          path: release-output/*.apk
          retention-days: 30

  # ========================================================
  # 5. iOS Mobile App (.ipa) — Capacitor
  # ========================================================
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode and iOS Platform
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi

          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode App & Archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -showdestinations || true
          # Attempt generic iOS device archive, fallback to generic iOS Simulator
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive || \
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package into IPA with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p build/Payload release-output
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r "../release-output/Zaynahs-POS-v${VERSION}.ipa" Payload
            cd ..
            ls -lh release-output/
          else
            echo "Error: App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-iOS-IPA
          path: release-output/*.ipa
          retention-days: 30

  # ========================================================
  # 6. Automated Universal GitHub Release Publishing
  # ========================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-dmg, build-windows-exe, build-linux-appimage, build-android-apk, build-ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Installers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Publish GitHub Release with Direct Download Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" release-files/* \
            --title "Zaynahs POS v${VERSION} (Universal All-Platform)" \
            --notes "Universal Multi-Platform Release v${VERSION} — macOS (Intel + Apple Silicon), Windows, Linux (AppImage/deb), Android, and iOS." \
            --draft=false \
            --prerelease=false || \
          gh release upload "v${VERSION}" release-files/* --clobber
