name: Build All Platforms (DMG, EXE, APK, IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. macOS Desktop Installer (.dmg)
  # ========================================================
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS Tauri DMG
        run: npx tauri build

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # ========================================================
  # 2. Windows Desktop Installer (.exe)
  # ========================================================
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Tauri EXE
        run: npx tauri build

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Windows-EXE
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  # ========================================================
  # 3. Android Mobile App (.apk)
  # ========================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ========================================================
  # 4. iOS Mobile App (.ipa)
  # ========================================================
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode and iOS Platform
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi

          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode App & Archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -showdestinations || true
          # Attempt generic iOS device archive, fallback to generic iOS Simulator
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive || \
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r Zaynahs-POS-iOS.ipa Payload
            ls -lh Zaynahs-POS-iOS.ipa
          else
            echo "Error: App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynahs-POS-iOS-IPA
          path: build/Zaynahs-POS-iOS.ipa
          retention-days: 30
