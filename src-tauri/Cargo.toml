[package]
name = "zaynahs-pos"
version = "1.0.0"
description = "Zaynahs POS — Autonomous Local-First Offline-First P2P Replicated POS System"
authors = ["Zaynahs POS Team"]
edition = "2021"

[lib]
name = "zaynahs_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
